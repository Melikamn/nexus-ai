services:
  postgres:
    image: postgres:16
    container_name: nexus-ai-postgres
    environment:
      POSTGRES_DB: nexus_ai
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: nexus_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
